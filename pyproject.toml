[project]
name = "north-micro-vision-studio"
version = "0.1.0"
description = "Streamlit studio for Cohere North Micro Vision (bf16) on Apple Silicon via MLX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.57",
    "mlx-vlm==0.6.15",
    "pillow>=11.0",
    "numpy>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ty.environment]
# Match the floor of requires-python and ruff's target-version, so anything
# that only exists on 3.12+ is caught even though the venv runs 3.12.
python-version = "3.11"

[[tool.ty.overrides]]
# tests/ is a standalone script that inserts the repo root on sys.path rather
# than being importable as a package.
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-import = "warn"
